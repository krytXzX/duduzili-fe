<main class="relative flex min-h-full h-full w-full overflow-auto bg-white">
  <!-- Left Section (Form Area) -->
  <section class="flex flex-1 flex-col items-center justify-start px-0 py-0 lg:justify-center-safe"
    aria-labelledby="auth-title">

    <header
      class="w-full flex items-center justify-between px-6 py-6 lg:px-10 lg:py-8 border-b border-gray-50/50 self-start">
      <!-- Full Logo (Desktop) -->
      <img class="hidden sm:block h-[26px] w-[111.913px]" [ngSrc]="fullLogoUrl" alt="Duduzili" width="112" height="26"
        priority />
      <!-- Icon Logo (Mobile) -->
      <img class="block sm:hidden h-[26px] w-[26px]" [ngSrc]="iconLogoUrl" alt="Duduzili" width="26" height="26"
        priority />

      <div class="flex items-center gap-4 text-[13px] sm:text-[14px]">
        @if (isSignIn()) {
        <span class="text-[#777777]">Don't have a Duduzili account?</span>
        <a routerLink="/sign-up"
          class="bg-[#F2F2F2] hover:bg-[#EAEAEA] text-[#15162B] font-bold px-4 py-2 sm:px-5 sm:py-2.5 rounded-full transition-all whitespace-nowrap text-center">
          Create a new account
        </a>
        } @else {
        <span class="text-[#777777]">Already have a Duduzili account?</span>
        <a routerLink="/sign-in"
          class="bg-[#F2F2F2] hover:bg-[#EAEAEA] text-[#15162B] font-bold px-4 py-2 sm:px-5 sm:py-2.5 rounded-full transition-all whitespace-nowrap text-center">
          Sign in
        </a>
        }
      </div>
    </header>

    <div
      class="mt-10 flex w-full max-w-112.75 flex-col items-center justify-center gap-8 sm:mt-12 sm:gap-10 lg:mt-0 lg:w-fit lg:max-w-full lg:gap-11 px-2 flex-1">
      <!-- Shared Form Area Header -->
      <img class="h-[82.074px] w-[82.074px]" [ngSrc]="markUrl" alt="" width="82" height="82" priority />

      <!-- Page Content (Router Outlet) -->
      <router-outlet></router-outlet>

      <!-- Shared Terms of Service -->
      <div class="mt-4 text-center text-[12px] text-[#777777] px-6">
        By continuing, you agree to Duduzili's
        <a routerLink="/terms-of-service" class="font-bold text-[#15162b] underline hover:text-[#6453d9] transition-colors">Terms of Service</a> and
        <a routerLink="/terms-of-service" class="font-bold text-[#15162b] underline hover:text-[#6453d9] transition-colors">Privacy Policy</a>.
      </div>
    </div>
  </section>

  <!-- Right Section (Hero Area) -->
  <section class="flex-1 overflow-hidden h-full hidden lg:block sticky inset-y-0">
    <div class="absolute size-full! inset-0! rounded-l-3xl bg-[#f2f2f2] overflow-hidden">
      <img class="size-full object-cover" [ngSrc]="heroSkyUrl" alt="" width="911" height="1215" priority />

      <!-- Iphone Card -->
      <div
        class="absolute top-[72px] left-[98px] h-[166px] w-[557px] rotate-[6.34deg] overflow-hidden rounded-[24px] border border-[#eaeaea] bg-white shadow-[0_12px_32px_rgba(94,94,94,0.25)]">
        <div
          class="absolute top-[3px] left-[3px] h-[158px] w-[266px] rounded-[20px] border border-[#eaeaea] bg-[#efefef]">
          <img class="absolute top-[6px] left-[61px] h-[145.63px] w-[145.63px] object-cover" [ngSrc]="phoneImageUrl"
            alt="" width="146" height="146" />
          <img class="absolute top-[11px] right-[11px] h-6 w-6" [ngSrc]="productLikeUrl" alt="" width="24"
            height="24" />
          <div
            class="absolute top-[11px] left-[11px] inline-flex h-6 items-center gap-1 rounded-[8px] border border-[#eaeaea] bg-white px-2 py-1 text-[12px] leading-4 font-semibold text-black">
            <img [ngSrc]="verifiedBadgeIconUrl" alt="" width="14" height="14" />
            <span>Verified</span>
          </div>
        </div>

        <div class="absolute top-[13px] left-[282px] flex w-[248px] flex-col gap-[7.176px] text-[#1f1f1f]">
          <p class="m-0 text-[25.118px] leading-[35.882px] font-normal">Iphone 17 pro max</p>
          <div class="inline-flex items-center gap-0 text-[28.706px] leading-[43.059px] font-medium">
            <img [ngSrc]="nairaIconUrl" alt="" width="29" height="29" />
            <span>1,200,000</span>
          </div>
        </div>
      </div>

      <!-- Seller Card -->
      <div
        class="absolute top-[184px] left-10 h-[166px] w-[557px] rotate-[-3.4deg] overflow-hidden rounded-[24px] border border-[#eaeaea] bg-white shadow-[0_12px_32px_rgba(94,94,94,0.25)]">
        <div class="absolute top-[3px] left-[3px] h-[158px] w-[551px] overflow-hidden rounded-t-[20px]">
          <img class="h-[158px] w-[551px] object-cover" [ngSrc]="closetBannerUrl" alt="" width="551" height="158" />
        </div>
        <div class="absolute top-7 left-[188.55px] flex w-[203px] flex-col items-center gap-[7px]">
          <img class="h-[74px] w-[74px] rounded-[1000px] border-4 border-white object-cover" [ngSrc]="sellerAvatarUrl"
            alt="" width="74" height="74" />
          <div class="flex flex-col items-start">
            <div class="inline-flex items-center gap-1 text-[16px] leading-6 font-medium text-[#1f1f1f]">
              <p class="m-0">Snap Thrifts</p>
              <img [ngSrc]="sellerVerifyIconUrl" alt="" width="14" height="14" />
            </div>
          </div>
        </div>
      </div>

      <!-- Hero Person Image -->
      <img class="absolute top-[-81px] left-px h-[1263px] w-[689px] object-cover" [ngSrc]="heroImageUrl" alt=""
        width="689" height="1263" priority />
    </div>
  </section>
</main>
