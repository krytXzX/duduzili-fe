  <h1 id="sign-in-title"
    class="m-0 w-full max-w-[290px] text-center text-[24px] leading-[1.18] font-medium tracking-[-0.03em] text-[#15162b] sm:max-w-88 lg:w-112.75 lg:max-w-none lg:leading-none">
    Sign in to your Duduzili account
  </h1>

  <div class="flex w-full max-w-[360px] flex-col gap-4" aria-label="Social sign in options">
    <button
      class="inline-flex min-h-[50px] w-full items-center justify-center gap-2 rounded-[100px] border border-[#F3F3F5] bg-[#F7F7F8] px-4 text-[16px] leading-5 font-medium text-[#36394a] transition-[transform,box-shadow,background-color,filter] duration-180 hover:-translate-y-px hover:bg-[#f0f0f4] hover:shadow-[0_6px_18px_rgba(21,22,43,0.08)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#6453d9] lg:h-10 lg:min-h-0"
      type="button">
      <ng-icon class="inline-flex h-5 w-5 shrink-0 items-center justify-center text-[#4285f4]" name="faBrandGoogle" />
      <span>Continue with Google</span>
    </button>

    <button
      class="inline-flex min-h-[50px] w-full items-center justify-center gap-2 rounded-[100px] border border-[#F3F3F5] bg-[#F7F7F8] px-4 text-[16px] leading-5 font-medium text-[#36394a] transition-[transform,box-shadow,background-color,filter] duration-180 hover:-translate-y-px hover:bg-[#f0f0f4] hover:shadow-[0_6px_18px_rgba(21,22,43,0.08)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#6453d9] lg:h-10 lg:min-h-0"
      type="button">
      <ng-icon class="inline-flex h-5 w-5 shrink-0 items-center justify-center text-black" name="faBrandApple" />
      <span>Continue with Apple</span>
    </button>
  </div>

  <div class="flex h-[15px] w-full max-w-[360px] items-center gap-6" aria-hidden="true">
    <span class="h-px flex-1 bg-[#ebebeb]"></span>
    <p class="m-0 text-[14px] leading-[1.1] font-medium tracking-[-0.21px] text-[rgba(30,30,30,0.3)]">OR</p>
    <span class="h-px flex-1 bg-[#ebebeb]"></span>
  </div>

  <form class="flex w-full max-w-[360px] flex-col gap-5" [formGroup]="loginForm" (ngSubmit)="continueWithEmail()" novalidate>
    <div class="relative">
      <label class="mb-1.5 block text-[14px] leading-5 font-medium tracking-[-0.5px] text-[#777777]" for="email-address">
        Email address
      </label>
      <input id="email-address"
        class="h-12 w-full rounded-[16px] border border-[#E9E9EE] bg-white pr-[52px] pl-4 text-[14px] text-[#36394a] aria-invalid:border-[#d24b4b] transition-all focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#6453d9] lg:h-10"
        [class.bg-gray-50]="isEmailValidated()" [readonly]="isEmailValidated()" type="email" formControlName="email"
        inputmode="email" autocomplete="email" [attr.aria-invalid]="submitted() && emailControl.invalid" />

      <div class="absolute right-4 top-[38px] hidden h-5 w-5 items-center justify-center sm:flex">
        @if (isCheckingEmail()) {
        <svg class="animate-spin h-4 w-4 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>
        } @else if (isEmailValidated()) {
        <svg class="h-5 w-5 text-emerald-500" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
            clip-rule="evenodd" />
        </svg>
        } @else {
        <img class="pointer-events-none h-5 w-5 rotate-180 opacity-30" [ngSrc]="inputChevronUrl" alt="" width="20"
          height="20" />
        }
      </div>
    </div>

    @if (isEmailValidated()) {
    <div class="relative animate-in slide-in-from-top-2 duration-300">
      <div class="flex justify-between items-center mb-1">
        <label class="text-[14px] leading-5 font-medium tracking-[-0.5px] text-[#777777]" for="password">
          Password
        </label>
        <a routerLink="/forgot-password" class="text-[12px] font-bold text-indigo-600 hover:text-indigo-800">Forgot password?</a>
      </div>
      <input id="password"
        class="h-12 w-full rounded-[16px] border border-[#E9E9EE] bg-white pr-[52px] pl-4 text-[14px] text-[#36394a] aria-invalid:border-[#d24b4b] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#6453d9] lg:h-10"
        type="password" formControlName="password" inputmode="password" autocomplete="current-password"
        [attr.aria-invalid]="submitted() && passwordControl.invalid" />
      <div class="absolute top-[38px] right-4 hidden h-5 w-5 items-center justify-center opacity-30 sm:flex">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
      </div>
    </div>
    }

    <button
      class="mt-3 min-h-[56px] w-full rounded-[100px] border-0 bg-[#B9AFF2] px-4 text-[14px] leading-5 font-medium text-white shadow-[0_6px_18px_rgba(145,130,231,0.28),0_0_0_1px_#b7acf0] transition-all duration-180 hover:-translate-y-px hover:brightness-[1.02] hover:shadow-[0_10px_22px_rgba(145,130,231,0.34),0_0_0_1px_#b7acf0] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#6453d9] lg:h-10 lg:min-h-0 disabled:pointer-events-none disabled:opacity-70"
      type="submit" [disabled]="isCheckingEmail()">
      {{ isEmailValidated() ? 'Sign in' : 'Continue with email' }}
    </button>
  </form>
