<h1 id="auth-title"
  class="m-0 w-full max-w-72 text-center text-[24px] leading-tight font-medium text-[#15162b] sm:max-w-88 lg:w-112.75 lg:max-w-none lg:leading-none">
  Authentication required
</h1>

<p class="m-0 text-center text-[14px] leading-5 text-[#777777] max-w-[320px]">
  {{ description() }}
</p>

<form (ngSubmit)="onSubmit()" class="flex w-full flex-col items-center gap-10" novalidate>
  <app-otp-input 
    [length]="6" 
    [submitted]="submitted()" 
    (codeChange)="onCodeChange($event)"
  />

  <div class="flex w-full flex-col gap-8">
    @if (errorMessage()) {
      <p class="text-center text-[14px] leading-5 text-[#D14343]">
        {{ errorMessage() }}
      </p>
    }

    <div class="text-center text-[14px]">
      <span class="text-[#777777]">Didn't get a code? </span>
      <button type="button" class="font-bold text-[#6453d9] hover:underline bg-transparent border-0 p-0 transition-all active:scale-95">Resend</button>
    </div>

    <button
      class="min-h-11 w-full rounded-[100px] border-0 bg-[#6453d9] px-4 text-[14px] leading-5 font-medium text-white shadow-[0_4px_12px_rgba(81,35,173,0.33)] transition-all duration-180 hover:-translate-y-px hover:brightness-[1.04] hover:shadow-[0_10px_22px_rgba(81,35,173,0.38)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#6453d9] lg:h-12 lg:min-h-0 disabled:opacity-70 disabled:pointer-events-none font-sans"
      type="submit"
      [disabled]="isProcessing()">
      @if (isProcessing()) {
      <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
        </path>
      </svg>
      }
      Confirm and continue
    </button>
  </div>
</form>
