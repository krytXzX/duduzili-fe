<a [routerLink]="store().route ?? ['/my-stores', store().id]" class="block bg-white rounded-[32px] overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-100 group cursor-pointer relative">
  <div class="h-32 overflow-hidden bg-gray-100">
    <img [src]="store().banner" [alt]="store().name" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
  </div>

  @if (store().activeUntil) {
    <div class="absolute left-4 top-4 z-10 rounded-full bg-[#F2F5A7] px-2 py-1 text-[10px] font-bold text-[#6A6B1F]">
      Active until {{ store().activeUntil }}
    </div>
  }
  
  <div class="p-4 pt-10 text-center relative">
    <!-- Store Logo Circle -->
    <div class="absolute -top-10 left-1/2 -translate-x-1/2 w-20 h-20 rounded-full border-4 border-white overflow-hidden bg-white shadow-md">
       <img [src]="store().logo" [alt]="store().name" class="w-full h-full object-cover">
    </div>

    <h3 class="font-bold text-[#36394A] flex items-center justify-center gap-1 mb-1">
      {{ store().name }}
      @if (store().isVerified) {
        <svg class="w-4 h-4 text-blue-500" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
        </svg>
      }
    </h3>
    <p class="text-xs text-gray-400 font-medium tracking-tight">{{ store().metaLabel ?? (store().followers + ' followers') }}</p>
  </div>

  <button class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center text-white hover:bg-white/40 transition-all opacity-0 group-hover:opacity-100">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
    </svg>
  </button>
</a>
