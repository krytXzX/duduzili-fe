<a [routerLink]="store().route ?? ['/my-stores', store().id]" class="group relative block cursor-pointer overflow-hidden rounded-[18px] border border-gray-100 bg-white shadow-sm transition-all duration-300 hover:shadow-xl md:rounded-[32px]">
  <div class="h-16 overflow-hidden bg-gray-100 md:h-32">
    <img [src]="store().banner" [alt]="store().name" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
  </div>

  @if (store().activeUntil) {
    <div class="absolute left-4 top-4 z-10 rounded-full bg-[#F2F5A7] px-2 py-1 text-[10px] font-bold text-[#6A6B1F]">
      Active until {{ store().activeUntil }}
    </div>
  }
  
  <div class="relative p-2.5 pt-6 text-center md:p-4 md:pt-10">
    <!-- Store Logo Circle -->
    <div class="absolute -top-5 left-1/2 h-10 w-10 -translate-x-1/2 overflow-hidden rounded-full border-2 border-white bg-white shadow-md md:-top-10 md:h-20 md:w-20 md:border-4">
       <img [src]="store().logo" [alt]="store().name" class="w-full h-full object-cover">
    </div>

    <h3 class="mb-1 flex items-center justify-center gap-1 text-[11px] font-semibold text-[#36394A] md:font-bold">
      {{ store().name }}
      @if (store().isVerified) {
        <svg class="h-3.5 w-3.5 text-blue-500 md:h-4 md:w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
        </svg>
      }
    </h3>
    <p class="text-[9px] font-medium tracking-tight text-gray-400 md:text-xs">{{ store().metaLabel ?? (store().followers + ' followers') }}</p>
  </div>

  @if (showFavorite()) {
    <button class="absolute right-2 top-2 hidden h-8 w-8 items-center justify-center rounded-full bg-white/20 text-white backdrop-blur-md transition-all hover:bg-white/40 md:flex md:opacity-0 md:group-hover:opacity-100">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
      </svg>
    </button>
  }
</a>
