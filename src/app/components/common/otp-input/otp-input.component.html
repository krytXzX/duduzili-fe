<div [class]="containerClass()" (paste)="handlePaste($event)">
  <div [class]="groupClass()">
    @for (field of otpFields().slice(0, halfLength()); track $index) {
      <input
        #digitInput
        [class]="inputClass()"
        [style.borderRadius]="fieldBorderRadius($index)"
        [style.borderColor]="submitted() && !field ? '#d24b4b' : 'transparent'"
        type="text"
        [value]="field"
        (input)="updateOtpValue($index, $event)"
        (keydown)="handleKeydown($index, $event)"
        maxlength="1"
        inputmode="numeric"
        autocomplete="one-time-code"
        [attr.aria-label]="fieldAriaLabel($index)"
      />
    }
  </div>

  @if (length() >= 4 && length() % 2 === 0) {
    <span [class]="separatorClass()" aria-hidden="true"></span>
  }

  <div [class]="groupClass()">
    @for (field of otpFields().slice(halfLength()); track $index) {
      <input
        #digitInput
        [class]="inputClass()"
        [style.borderRadius]="fieldBorderRadius($index + halfLength())"
        [style.borderColor]="submitted() && !field ? '#d24b4b' : 'transparent'"
        type="text"
        [value]="field"
        (input)="updateOtpValue($index + halfLength(), $event)"
        (keydown)="handleKeydown($index + halfLength(), $event)"
        maxlength="1"
        inputmode="numeric"
        autocomplete="one-time-code"
        [attr.aria-label]="fieldAriaLabel($index + halfLength())"
      />
    }
  </div>
</div>
