<section class="mb-12 px-2 md:mb-16 md:px-4">
  <div class="relative">
    <div #categoriesScroller class="flex items-start gap-4 overflow-x-auto no-scrollbar py-4 pl-2 pr-2 md:gap-8 md:pl-20 md:pr-20 md:justify-start lg:justify-center">
      @for (category of categories(); track category.id) {
        <div class="group flex min-w-[64px] max-w-[72px] cursor-pointer flex-col items-center gap-2 md:min-w-[100px] md:max-w-[120px] md:gap-3">
          <div class="flex h-14 w-14 items-center justify-center rounded-full bg-[#F7F7FA] transition-all group-hover:bg-[#e9ecef] md:h-16 md:w-16">
            <img
              [ngSrc]="category.icon"
              [alt]="category.name"
              width="28"
              height="28"
              class="h-7 w-7 object-contain md:h-8 md:w-8"
            >
          </div>
          <span class="text-center text-[10px] font-medium leading-4 text-[#36394A] md:max-w-[120px] md:text-sm md:font-semibold md:line-clamp-2">
            {{ category.name }}
          </span>
        </div>
      }
    </div>

    <button
      type="button"
      (click)="scrollCategoriesBackward()"
      class="absolute left-0 top-1/2 z-10 hidden h-12 w-12 -translate-y-1/2 items-center justify-center rounded-full border border-gray-100 bg-white/95 text-gray-400 shadow-[0_12px_24px_-16px_rgba(17,24,39,0.35)] backdrop-blur-sm transition hover:bg-gray-50 md:flex"
      aria-label="Scroll categories backward"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    <button
      type="button"
      (click)="scrollCategories()"
      class="absolute right-0 top-1/2 z-10 hidden h-12 w-12 -translate-y-1/2 items-center justify-center rounded-full border border-gray-100 bg-white/95 text-gray-400 shadow-[0_12px_24px_-16px_rgba(17,24,39,0.35)] backdrop-blur-sm transition hover:bg-gray-50 md:flex"
      aria-label="Scroll categories"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </div>
</section>
