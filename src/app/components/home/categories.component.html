<section class="mb-16 px-4">
  <div class="relative">
    <div #categoriesScroller class="flex items-center gap-8 overflow-x-auto no-scrollbar py-4 pl-20 pr-20 justify-start lg:justify-center">
      @for (category of categories(); track category.id) {
        <div class="flex flex-col items-center gap-3 min-w-[100px] cursor-pointer group">
          <div class="w-16 h-16 rounded-full bg-[#f8f9fa] flex items-center justify-center text-3xl group-hover:bg-[#e9ecef] transition-all">
            {{ category.icon }}
          </div>
          <span class="text-sm font-semibold text-[#36394A] text-center line-clamp-2 max-w-[120px]">
            {{ category.name }}
          </span>
        </div>
      }
    </div>

    <button
      type="button"
      (click)="scrollCategoriesBackward()"
      class="absolute left-0 top-1/2 z-10 flex h-12 w-12 -translate-y-1/2 items-center justify-center rounded-full border border-gray-100 bg-white/95 text-gray-400 shadow-[0_12px_24px_-16px_rgba(17,24,39,0.35)] backdrop-blur-sm transition hover:bg-gray-50"
      aria-label="Scroll categories backward"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    <button
      type="button"
      (click)="scrollCategories()"
      class="absolute right-0 top-1/2 z-10 flex h-12 w-12 -translate-y-1/2 items-center justify-center rounded-full border border-gray-100 bg-white/95 text-gray-400 shadow-[0_12px_24px_-16px_rgba(17,24,39,0.35)] backdrop-blur-sm transition hover:bg-gray-50"
      aria-label="Scroll categories"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </div>
</section>
