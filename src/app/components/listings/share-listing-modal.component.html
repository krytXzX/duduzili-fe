@if (isOpen()) {
  <div
    class="fixed inset-0 z-[80] flex items-end justify-center bg-black/40 p-0 backdrop-blur-[2px] md:items-center md:p-4"
    (click)="closeModal()"
  >
    <div
      class="relative flex max-h-[92dvh] w-full flex-col rounded-t-[36px] bg-white shadow-[0_30px_80px_-40px_rgba(19,27,45,0.45)] md:max-h-[85vh] md:max-w-[560px] md:rounded-[32px]"
      role="dialog"
      aria-modal="true"
      aria-labelledby="share-listing-title"
      (click)="$event.stopPropagation()"
    >
      <div class="absolute left-1/2 top-3 z-10 h-1 w-[50px] -translate-x-1/2 rounded-full bg-[#EBEBEB] md:hidden"></div>

      <button
        type="button"
        (click)="closeModal()"
        class="absolute right-4 top-4 z-10 flex h-11 w-11 items-center justify-center rounded-full border border-[#EAEAEA] bg-white text-[#434455] shadow-[0_4px_8px_rgba(202,202,202,0.25)] transition hover:bg-[#FAFAFA] md:right-5 md:top-5"
        aria-label="Close share listing modal"
      >
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>

      <div class="min-h-0 flex-1 overflow-y-auto px-4 pb-8 pt-12 md:px-6 md:pb-8 md:pt-8">
        <div class="mx-auto flex max-w-[500px] flex-col gap-6">
        <div class="space-y-2 pr-14">
          <h2 id="share-listing-title" class="text-[24px] font-semibold leading-8 text-[#15162B] md:text-[28px]">
            Share {{ itemType() }}
          </h2>
          <p class="text-[14px] leading-6 text-[#5B5D6B]">
            Share this {{ itemType() }} with friends or copy the link to send it anywhere.
          </p>
        </div>

        <div class="grid grid-cols-2 gap-3 md:grid-cols-4">
          @if (canUseNativeShare()) {
            <button
              type="button"
              (click)="shareListingWithDevice()"
              class="flex min-h-[92px] flex-col items-center justify-center gap-3 rounded-[22px] border border-[#EAEAEA] bg-[#F8F8FB] px-4 py-4 text-center text-[14px] font-medium text-[#1F1F1F] transition hover:bg-[#F1F1F6]"
            >
              <span class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-[#6453D9] shadow-[0_4px_8px_rgba(202,202,202,0.18)]">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v14" />
                </svg>
              </span>
              Use device share
            </button>
          }

          <button
            type="button"
            (click)="shareViaWhatsApp()"
            class="flex min-h-[92px] flex-col items-center justify-center gap-3 rounded-[22px] border border-[#EAEAEA] bg-[#F8F8FB] px-4 py-4 text-center text-[14px] font-medium text-[#1F1F1F] transition hover:bg-[#F1F1F6]"
          >
            <span class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-[#21C063] shadow-[0_4px_8px_rgba(202,202,202,0.18)]">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                  d="M20 12a8 8 0 0 1-11.72 7.05L4 20l1.02-4.08A8 8 0 1 1 20 12Z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                  d="M9.4 8.8c.2-.4.42-.41.6-.42h.51c.17.01.4.07.55.42l.72 1.72c.08.18.08.4-.03.58l-.5.79c-.1.16-.08.36.03.5.33.45.94 1.17 1.95 1.68.16.08.35.05.49-.07l.77-.65a.7.7 0 0 1 .64-.12l1.67.57c.28.1.4.3.42.55l.03.47c.01.23-.08.45-.27.6-.43.34-1.05.66-1.78.61-1.05-.07-2.25-.55-3.74-1.93-1.56-1.45-2.17-2.79-2.32-3.87-.1-.71.17-1.35.47-1.83Z"
                />
              </svg>
            </span>
            WhatsApp
          </button>

          <button
            type="button"
            (click)="shareViaX()"
            class="flex min-h-[92px] flex-col items-center justify-center gap-3 rounded-[22px] border border-[#EAEAEA] bg-[#F8F8FB] px-4 py-4 text-center text-[14px] font-medium text-[#1F1F1F] transition hover:bg-[#F1F1F6]"
          >
            <span class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-[#1F1F1F] shadow-[0_4px_8px_rgba(202,202,202,0.18)]">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M17.53 3H20.6l-6.7 7.66L21.8 21h-6.18l-4.84-6.33L5.25 21H2.17l7.17-8.2L2 3h6.34l4.37 5.77L17.53 3Zm-1.08 16.14h1.7L7.41 4.77H5.58l10.87 14.37Z" />
              </svg>
            </span>
            X
          </button>

          <button
            type="button"
            (click)="shareViaEmail()"
            class="flex min-h-[92px] flex-col items-center justify-center gap-3 rounded-[22px] border border-[#EAEAEA] bg-[#F8F8FB] px-4 py-4 text-center text-[14px] font-medium text-[#1F1F1F] transition hover:bg-[#F1F1F6]"
          >
            <span class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-[#1F1F1F] shadow-[0_4px_8px_rgba(202,202,202,0.18)]">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                  d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"
                />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="m3 7 9 6 9-6" />
              </svg>
            </span>
            Email
          </button>
          <button
            type="button"
            (click)="shareViaFacebook()"
            class="flex min-h-[92px] flex-col items-center justify-center gap-3 rounded-[22px] border border-[#EAEAEA] bg-[#F8F8FB] px-4 py-4 text-center text-[14px] font-medium text-[#1F1F1F] transition hover:bg-[#F1F1F6]"
          >
            <span class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-[#1877F2] shadow-[0_4px_8px_rgba(202,202,202,0.18)]">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
              </svg>
            </span>
            Facebook
          </button>

          <button
            type="button"
            (click)="shareViaLinkedIn()"
            class="flex min-h-[92px] flex-col items-center justify-center gap-3 rounded-[22px] border border-[#EAEAEA] bg-[#F8F8FB] px-4 py-4 text-center text-[14px] font-medium text-[#1F1F1F] transition hover:bg-[#F1F1F6]"
          >
            <span class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-[#0A66C2] shadow-[0_4px_8px_rgba(202,202,202,0.18)]">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
              </svg>
            </span>
            LinkedIn
          </button>

          <button
            type="button"
            (click)="shareViaTelegram()"
            class="flex min-h-[92px] flex-col items-center justify-center gap-3 rounded-[22px] border border-[#EAEAEA] bg-[#F8F8FB] px-4 py-4 text-center text-[14px] font-medium text-[#1F1F1F] transition hover:bg-[#F1F1F6]"
          >
            <span class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-[#26A5E4] shadow-[0_4px_8px_rgba(202,202,202,0.18)]">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.888-.662 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
              </svg>
            </span>
            Telegram
          </button>

          <button
            type="button"
            (click)="shareViaReddit()"
            class="flex min-h-[92px] flex-col items-center justify-center gap-3 rounded-[22px] border border-[#EAEAEA] bg-[#F8F8FB] px-4 py-4 text-center text-[14px] font-medium text-[#1F1F1F] transition hover:bg-[#F1F1F6]"
          >
            <span class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-[#FF4500] shadow-[0_4px_8px_rgba(202,202,202,0.18)]">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M24 11.5c0-1.65-1.35-3-3-3-.96 0-1.86.48-2.42 1.24-1.64-1-3.75-1.64-6.07-1.72l1.27-5.95 4.15.88c.02 1.21.98 2.2 2.19 2.2 1.22 0 2.21-.99 2.21-2.2s-.99-2.2-2.21-2.2c-1.01 0-1.86.68-2.12 1.62l-4.57-.96c-.24-.05-.49.1-.55.33l-1.42 6.64c-2.4.05-4.6.68-6.31 1.69C4.6 8.98 3.7 8.5 2.75 8.5c-1.65 0-3 1.35-3 3 0 1.32.84 2.44 2.05 2.84-.03.22-.05.44-.05.66 0 3.86 4.5 7 10 7s10-3.14 10-7c0-.22-.02-.44-.05-.66 1.21-.4 2.05-1.52 2.05-2.84zM2.3 11.5c0-.83.67-1.5 1.5-1.5.47 0 .88.22 1.15.55-1.15.82-1.95 1.94-2.29 3.23-.22-.38-.36-.81-.36-1.28zm18 3.5c0 3.03-3.81 5.5-8.5 5.5s-8.5-2.47-8.5-5.5c0-3.03 3.81-5.5 8.5-5.5s8.5 2.47 8.5 5.5zM7.5 16.5c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm9 0c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm-8.28 2.65c1 .9 2.44 1.35 4.28 1.35 1.84 0 3.28-.45 4.28-1.35.16-.14.18-.38.04-.54-.14-.16-.38-.18-.54-.04-.84.75-2.09 1.13-3.78 1.13-1.69 0-2.94-.38-3.78-1.13-.16-.14-.4-.12-.54.04-.14.16-.12.4.04.54zm11.54-4.42c-.34-1.29-1.14-2.41-2.29-3.23.27-.33.68-.55 1.15-.55.83 0 1.5.67 1.5 1.5 0 .47-.14.9-.36 1.28z"/>
              </svg>
            </span>
            Reddit
          </button>
        </div>

        <div class="space-y-2">
          <label for="share-listing-url" class="block text-[14px] font-medium leading-5 text-[#434455]">
            {{ itemType() === 'store' ? 'Store' : 'Listing' }} URL
          </label>
          <div class="flex items-center gap-2 rounded-[22px] border border-[#EAEAEA] bg-[#F8F8FB] p-2">
            <input
              id="share-listing-url"
              type="text"
              [value]="shareUrl()"
              readonly
              class="min-w-0 flex-1 bg-transparent px-3 py-3 text-[14px] leading-5 text-[#1F1F1F] outline-none"
              aria-label="Share URL"
            />
            <button
              type="button"
              (click)="copyShareUrl()"
              class="shrink-0 rounded-full bg-[#6453D9] px-4 py-3 text-[14px] font-medium text-white transition hover:bg-[#5645cb]"
            >
              {{ hasCopiedShareUrl() ? 'Copied' : 'Copy link' }}
            </button>
          </div>
        </div>
      </div>
      </div>
    </div>
  </div>
}
